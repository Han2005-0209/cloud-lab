version: '3.8'

services:
  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cloud_lab}
    networks:
      - mern-network

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "5173:80"
    networks:
      - mern-network
    depends_on:
      - backend

networks:
  mern-network:
    driver: bridge