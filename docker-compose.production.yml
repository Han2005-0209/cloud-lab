services:
  backend:
    image: trangiahan2005/mern-backend:2.0
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    networks:
      - mern-production

  frontend:
    image: trangiahan2005/mern-frontend:3.0
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - mern-production

networks:
  mern-production:
