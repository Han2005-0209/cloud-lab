version: '3.8'

services:
  backend:
    image: trangiahan2005/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/cloud_lab}
    networks:
      - mern-network-hub

  frontend:
    image: trangiahan2005/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "5173:80"
    networks:
      - mern-network-hub
    depends_on:
      - backend

networks:
  mern-network-hub:
    driver: bridge

